name: 'Gitea issue notify action'
description:
  'Notify Gitea issues and move them to a project column, including links from a
  changelog'
author: 'APS'

branding:
  icon: 'message-square'
  color: 'green'

inputs:
  token:
    description:
      'Gitea access token with issue comment and project write permissions'
    required: true
  to:
    description:
      'HTTPS issue URL: https://host/owner/repo/issues/42; optional when
      changelog is provided'
    required: false
  changelog:
    description:
      'Processed changelog text; each unique HTTPS issue link receives the
      messages (in addition to to)'
    required: false
  message:
    description: 'Comment text (Gitea Markdown)'
    required: false
  message_file:
    description: 'UTF-8 file containing comment text; sent before message'
    required: false
  move_to_column:
    description:
      'Target column title; empty disables moving. Requires Gitea 28.0.0+'
    required: false
    default: 'Тестирование'
  project_name:
    description:
      'Existing open repository project title; required if an issue has multiple
      such projects'
    required: false

outputs:
  moved_issue_count:
    description:
      'Number of issues successfully moved after their notification comments'
  comment_ids:
    description: 'JSON array of successfully created comment IDs'
  comment_urls:
    description: 'JSON array of successfully created comment URLs'
  comment_count:
    description: 'Number of successfully created comments'

runs:
  using: node24
  main: dist/index.js
